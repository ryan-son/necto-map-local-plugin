name: Necto latest
on:
  schedule: [{ cron: "0 0 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The panel is rebuilt against the latest @necto/bridge.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.12" }
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "Xcode 26 not found"; exit 1; }
          sudo xcode-select -s "$xcode"
      - run: script/check-necto-latest
