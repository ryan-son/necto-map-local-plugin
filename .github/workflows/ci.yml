name: CI
on:
  push: { branches: [main] }
  pull_request:
# CI only reads the repository.
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # Actions are pinned to commits (script/lint-workflows checks); the comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.12" }
      # The configuration name rule and the release controls were measured on Xcode 26.
      - name: Select Xcode 26 (fail without it)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "Xcode 26 not found"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # npm ci --ignore-scripts from the lockfile runs inside script/build-panel.
      - run: script/ci
